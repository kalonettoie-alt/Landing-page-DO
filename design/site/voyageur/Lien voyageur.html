<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lien voyageur</title>
<style>
@font-face{font-family:'Jakarta';font-style:normal;font-display:swap;font-weight:200 800;src:url('../fonts/plus-jakarta-sans-latin-wght-normal.woff2') format('woff2-variations')}
*{box-sizing:border-box}body{margin:0;font-family:'Jakarta',system-ui,sans-serif;background:#E9E6E0;color:#172524;-webkit-font-smoothing:antialiased}
a{color:#1A3A3A}a:hover{color:#172524}button{font:inherit;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:18px 16px 4px}
.seg{display:flex;gap:2px;padding:4px;border-radius:99px;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:650;color:#56625F;white-space:nowrap}.seg button.on{background:#172524;color:#fff}
.seg small{align-self:center;padding:0 8px 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A9694}
.stage{display:flex;justify-content:center;padding:20px 16px 50px}
.phone{width:390px;height:800px;border-radius:48px;background:#111;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.2)}
.phone iframe{width:100%;height:100%;border:0;border-radius:38px;background:#121614;display:block}
@media (max-width:440px){.phone{width:100%;height:760px}}
</style>
</head>
<body>
<div class="bar"><div class="seg" id="mo"><small>Moment</small><button data-m="avant">Avant l’arrivée</button><button data-m="pendant">Pendant</button><button data-m="depart">Jour du départ</button></div><div class="seg" id="lg"><small>Langue</small><button data-l="fr">FR</button><button data-l="en">EN</button><button data-l="es">ES</button></div></div>
<div class="stage"><div class="phone"><iframe src="C - Immersif.html" title="Lien voyageur"></iframe></div></div>
<script>
const f=document.querySelector('iframe');const st={m:localStorage.getItem('lv-moment')||'avant',l:localStorage.getItem('lv-lang')||'fr'};
const sync=()=>{document.querySelectorAll('#mo button').forEach(b=>b.classList.toggle('on',b.dataset.m===st.m));document.querySelectorAll('#lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===st.l));f.contentWindow&&f.contentWindow.postMessage({lvMoment:st.m,lvLang:st.l},'*')};
mo.onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;st.m=b.dataset.m;localStorage.setItem('lv-moment',st.m);sync()};
lg.onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;st.l=b.dataset.l;localStorage.setItem('lv-lang',st.l);sync()};
f.addEventListener('load',sync);sync();
</script>
</body>
</html>
